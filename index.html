<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>♡ Letter for You ♡</p>
    </div>

    <!-- Audio Screen -->
    <div id="audio-wrapper">
      <div id="audio-container">
        <div class="audio-window">
          <h1>🎵 Press Me 🎵</h1>
          <button id="play-audio-btn"><strong>;3</strong></button>
          <audio id="valentine-audio" src="Bubblegum K.K. - K.K. Slider.mp3"></audio>
        </div>
      </div>
    </div>

    <!-- Letter Screen -->
    <div id="letter-wrapper">
      <div id="letter-container">
        <div class="letter-window">
          <h1 id="letter-title">Will you be my Valentine?</h1>

          <img src="happy-hopper.gif" class="cat" id="letter-cat" />

          <div class="buttons" id="letter-buttons">
            <img src="yes.png" class="btn yes-btn" alt="Yes" />

            <div class="no-wrapper">
              <img src="no.png" class="btn no-btn" alt="No" />
            </div>
          </div>

          <p id="final-text" class="final-text" style="display: none">
            <strong>Valentine Date:</strong> Kissing and loving you. (also gambling muehehehehehehhe)
          </p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
